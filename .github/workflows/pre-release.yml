name: Pre-release

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  title:
    name: Semantic Title
    runs-on: ubuntu-24.04
    steps:
      - name: Lint Pull Request Title
        uses: craigsloggett/lint-pull-request-title@d21a57f48558d718c8591d3c86249b70797eb350 # v1.0.0
